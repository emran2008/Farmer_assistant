      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f3f8f5;
        color: #222;
        min-height: 100vh;
        padding-bottom: 90px;
      }

      /* Header */
      .header {
        background: white;
        padding: 28px 5%;
        border-bottom: 1px solid #eee;
      }

      .header h1 {
        color: #168b4d;
        font-size: 34px;
      }

      /* Main */
      .container {
        max-width: 1100px;
        margin: auto;
        padding: 35px 20px;
      }

 .title {
    background: white;

    text-align: center;

    padding: 24px 20px;

    margin-bottom: 25px;

    border-radius: 22px;

    border: 1px solid #e5e7eb;

    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
}

      .title h2 {
        color: #168b4d;
        font-size: 32px;
        margin-bottom: 8px;
      }

      .title p {
        color: #777;
        font-size: 17px;
      }

      /* Location Box */
      .location-box {
        background: white;
        border-radius: 18px;
        padding: 25px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
        margin-bottom: 25px;
      }

      .location-box h3 {
        color: #168b4d;
        margin-bottom: 20px;
      }

      .inputs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      select,
      input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
      }

      select:focus,
      input:focus {
        border-color: #168b4d;
      }

      .search-btn {
        margin-top: 20px;
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #168b4d;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
      }

      .search-btn:hover {
        background: #10733e;
      }

      /* Current Weather */
      .current-weather {
        background: linear-gradient(135deg, #168b4d, #25a65f);
        color: white;
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 25px;
        display: none;
      }

      .current-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
      }

      .location-name {
        font-size: 24px;
        font-weight: bold;
      }

      .date {
        margin-top: 7px;
        opacity: 0.9;
      }

      .temperature {
        font-size: 55px;
        font-weight: bold;
      }

      .weather-status {
        font-size: 18px;
        margin-top: 5px;
      }

      /* Weather Cards */
      .weather-cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-top: 25px;
      }

      .weather-card {
        background: white;
        color: #222;
        border-radius: 15px;
        padding: 20px;
        text-align: center;
      }

      .weather-card .icon {
        font-size: 30px;
        margin-bottom: 8px;
      }

      .weather-card h4 {
        color: #777;
        margin-bottom: 7px;
        font-size: 14px;
      }

      .weather-card p {
        font-size: 20px;
        font-weight: bold;
        color: #168b4d;
      }

      /* Forecast */
      .forecast-section {
        display: none;
        background: white;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
      }

      .forecast-section h3 {
        color: #168b4d;
        margin-bottom: 20px;
      }

      .forecast {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 10px;
      }

      .forecast-card {
        background: #f4f8f5;
        border-radius: 13px;
        padding: 15px 8px;
        text-align: center;
      }

      .forecast-card .day {
        font-weight: bold;
        color: #168b4d;
        margin-bottom: 10px;
      }

      .forecast-icon {
        font-size: 28px;
        margin-bottom: 10px;
      }

      .forecast-temp {
        font-weight: bold;
        margin-bottom: 8px;
      }

      .rain {
        color: #168b4d;
        font-size: 13px;
      }

      /* Loading */
      .loading {
        display: none;
        text-align: center;
        padding: 25px;
        color: #168b4d;
        font-weight: bold;
      }

      .error {
        display: none;
        background: #ffecec;
        color: #c0392b;
        padding: 15px;
        border-radius: 10px;
        margin-top: 15px;
        text-align: center;
      }

      /* Bottom Navigation */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 80px;
        background: white;
        border-top: 1px solid #eee;
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 100;
      }

      .nav-item {
        text-align: center;
        color: #168b4d;
        text-decoration: none;
        font-size: 14px;
      }

      .nav-item .nav-icon {
        font-size: 28px;
        display: block;
        margin-bottom: 4px;
      }

      .nav-item.active {
        font-weight: bold;
      }

      /* Mobile */
      @media (max-width: 800px) {
        .inputs {
          grid-template-columns: 1fr;
        }

        .weather-cards {
          grid-template-columns: repeat(2, 1fr);
        }

        }

        .current-top {
          flex-direction: column;
          text-align: center;
        }

    <script>
      // ==========================================
      // Division → District → Upazila
      // ==========================================

      const divisionSelect = document.getElementById("division");
      const districtSelect = document.getElementById("district");
      const upazilaSelect = document.getElementById("upazila");

      // এখানে প্রতিটি জেলার উপজেলা জমা থাকবে
      let districtUpazilas = {};

      // ==========================================
      // বিভাগ নির্বাচন করলে জেলা + উপজেলা data আসবে
      // ==========================================

      divisionSelect.addEventListener("change", async function () {
        const division = this.value;

        // Reset
        districtSelect.innerHTML =
          '<option value="">জেলা নির্বাচন করুন</option>';

        upazilaSelect.innerHTML =
          '<option value="">আগে জেলা নির্বাচন করুন</option>';

        districtSelect.disabled = true;
        upazilaSelect.disabled = true;

        // আগের data মুছে ফেলি
        districtUpazilas = {};

        if (!division) {
          districtSelect.innerHTML =
            '<option value="">আগে বিভাগ নির্বাচন করুন</option>';

          return;
        }

        try {
          const response = await fetch(
            `https://bdapis.com/api/v1.2/division/${encodeURIComponent(division)}`,
          );

          if (!response.ok) {
            throw new Error("Division API failed");
          }

          const result = await response.json();

          console.log("Division:", division);
          console.log("District data:", result);

          if (!result.data || !Array.isArray(result.data)) {
            throw new Error("District data পাওয়া যায়নি");
          }

          // ==========================================
          // District + তার Upazila save করা
          // ==========================================

          result.data.forEach(function (item) {
            const districtName = item.district;

            // এই জেলার উপজেলা save করছি
            districtUpazilas[districtName] = Array.isArray(item.upazilla)
              ? item.upazilla
              : [];

            // District dropdown
            const option = document.createElement("option");

            option.value = districtName;
            option.textContent = districtName;

            districtSelect.appendChild(option);
          });

          districtSelect.disabled = false;

          console.log("District → Upazila:", districtUpazilas);
        } catch (error) {
          console.error("District Error:", error);

          districtSelect.innerHTML =
            '<option value="">জেলা লোড করা যায়নি</option>';
        }
      });

      // ==========================================
      // জেলা নির্বাচন করলে উপজেলা আসবে
      // ==========================================

      districtSelect.addEventListener("change", function () {
        const district = this.value;

        // Reset উপজেলা
        upazilaSelect.innerHTML =
          '<option value="">উপজেলা নির্বাচন করুন</option>';

        upazilaSelect.disabled = true;

        if (!district) {
          upazilaSelect.innerHTML =
            '<option value="">আগে জেলা নির্বাচন করুন</option>';

          return;
        }

        // নির্বাচিত জেলার উপজেলা
        const upazilas = districtUpazilas[district] || [];

        console.log("Selected District:", district);
        console.log("Upazilas:", upazilas);

        if (upazilas.length === 0) {
          upazilaSelect.innerHTML =
            '<option value="">উপজেলা পাওয়া যায়নি</option>';

          return;
        }

        // উপজেলা dropdown-এ বসানো
        upazilas.forEach(function (upazila) {
          const option = document.createElement("option");

          option.value = upazila;
          option.textContent = upazila;

          upazilaSelect.appendChild(option);
        });

        upazilaSelect.disabled = false;
      });

      async function getWeather() {
        const district = document.getElementById("district").value;

        const upazila = document.getElementById("upazila").value.trim();

        const error = document.getElementById("error");

        const loading = document.getElementById("loading");

        const currentWeather = document.getElementById("currentWeather");

        const forecastSection = document.getElementById("forecastSection");

        error.style.display = "none";

        if (!district) {
          error.innerText = "দয়া করে প্রথমে জেলা নির্বাচন করুন।";

          error.style.display = "block";

          return;
        }

        loading.style.display = "block";

        currentWeather.style.display = "none";

        forecastSection.style.display = "none";

        const location = locations[district];

        try {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${location.lat}&longitude=${location.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,rain,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,rain_sum&timezone=Asia%2FDhaka&forecast_days=7`;

          const response = await fetch(url);

          if (!response.ok) {
            throw new Error("Weather API error");
          }

          const data = await response.json();

          displayCurrentWeather(data, district, upazila);

          displayForecast(data);
        } catch (err) {
          error.innerText =
            "আবহাওয়ার তথ্য পাওয়া যাচ্ছে না। কিছুক্ষণ পর আবার চেষ্টা করুন।";

          error.style.display = "block";
        } finally {
          loading.style.display = "none";
        }
      }

      function displayCurrentWeather(data, district, upazila) {
        const current = data.current;

        let locationText = district;

        if (upazila) {
          locationText += " — " + upazila;
        }

        document.getElementById("locationName").innerText =
          "📍 " + locationText;

        document.getElementById("temperature").innerText =
          Math.round(current.temperature_2m) + "°C";

        document.getElementById("feels").innerText =
          Math.round(current.apparent_temperature) + "°C";

        document.getElementById("humidity").innerText =
          current.relative_humidity_2m + "%";

        document.getElementById("wind").innerText =
          Math.round(current.wind_speed_10m) + " km/h";

        document.getElementById("rain").innerText =
          Math.round(current.rain || 0) + " mm";

        document.getElementById("weatherStatus").innerText =
          getWeatherDescription(current.weather_code);

        const now = new Date();

        document.getElementById("currentDate").innerText =
          now.toLocaleDateString("bn-BD", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
          });

        document.getElementById("currentWeather").style.display = "block";
      }

      function displayForecast(data) {
        const forecast = document.getElementById("forecast");

        forecast.innerHTML = "";

        for (let i = 0; i < 7; i++) {
          const date = new Date(data.daily.time[i]);

          const day = date.toLocaleDateString("bn-BD", {
            weekday: "short",
          });

          const max = Math.round(data.daily.temperature_2m_max[i]);

          const min = Math.round(data.daily.temperature_2m_min[i]);

          const rain = data.daily.precipitation_probability_max[i];

          const weatherCode = data.daily.weather_code[i];

          const card = document.createElement("div");

          card.className = "forecast-card";

          card.innerHTML = `

                <div class="day">
                    ${day}
                </div>

                <div class="forecast-icon">
                    ${getWeatherIcon(weatherCode)}
                </div>

                <div class="forecast-temp">
                    ${max}° / ${min}°
                </div>

                <div class="rain">
                    🌧️ ${rain}%
                </div>

            `;

          forecast.appendChild(card);
        }

        document.getElementById("forecastSection").style.display = "block";
      }

      function getWeatherIcon(code) {
        if (code === 0) return "☀️";

        if (code === 1 || code === 2) return "🌤️";

        if (code === 3) return "☁️";

        if (code === 45 || code === 48) return "🌫️";

        if (code >= 51 && code <= 67) return "🌧️";

        if (code >= 71 && code <= 77) return "❄️";

        if (code >= 80 && code <= 82) return "🌦️";

        if (code >= 95) return "⛈️";

        return "🌤️";
      }

      function getWeatherDescription(code) {
        if (code === 0) return "☀️ পরিষ্কার আকাশ";

        if (code === 1 || code === 2) return "🌤️ আংশিক মেঘলা";

        if (code === 3) return "☁️ মেঘলা";

        if (code === 45 || code === 48) return "🌫️ কুয়াশা";

        if (code >= 51 && code <= 67) return "🌧️ বৃষ্টির সম্ভাবনা";

        if (code >= 71 && code <= 77) return "❄️ তুষারপাত";

        if (code >= 80 && code <= 82) return "🌦️ বৃষ্টির ঝরনা";

        if (code >= 95) return "⛈️ বজ্রসহ বৃষ্টি";

        return "🌤️ পরিবর্তনশীল আবহাওয়া";
      }
    </script>
  </body>
</html>
